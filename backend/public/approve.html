<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reply</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --fg: var(--tg-theme-text-color, #111);
    --muted: var(--tg-theme-hint-color, #888);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --btn: var(--tg-theme-button-color, #2a7de1);
    --btn-fg: var(--tg-theme-button-text-color, #fff);
    --danger: var(--tg-theme-destructive-text-color, #d33);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  .who { font-weight: 600; font-size: 17px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .thread { margin: 12px 0 16px; display: flex; flex-direction: column; gap: 6px; }
  .bubble { max-width: 85%; border-radius: 12px; padding: 8px 12px; white-space: pre-wrap; font-size: 15px; }
  .bubble.them { align-self: flex-start; background: var(--card); }
  .bubble.us { align-self: flex-end; background: var(--btn); color: var(--btn-fg); }
  .when { font-size: 11px; opacity: .65; margin-top: 2px; }
  .links { display: flex; gap: 8px; margin: 10px 0 0; }
  .links a { flex: 1; text-align: center; text-decoration: none; background: var(--card); color: var(--fg); border-radius: 10px; padding: 8px; font-size: 14px; }
  .theirs { background: var(--card); border-radius: 12px; padding: 12px; margin: 12px 0 16px; white-space: pre-wrap; }
  label { display: block; color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  textarea, input { width: 100%; font: inherit; color: var(--fg); background: var(--card); border: 0; border-radius: 12px; padding: 12px; }
  textarea { min-height: 120px; resize: vertical; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row input { flex: 1; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; }
  .send { width: 100%; margin-top: 16px; background: var(--btn); color: var(--btn-fg); font-weight: 600; font-size: 17px; padding: 14px; }
  .ghost { background: var(--card); color: var(--fg); }
  .skip { width: 100%; margin-top: 8px; background: transparent; color: var(--danger); }
  button:disabled { opacity: .5; }
  body { padding-bottom: 96px; }
  .top { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-bottom: 8px; min-height: 1em; }
  .flash { color: var(--btn); }
  .tag { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--card); border-radius: 6px; padding: 2px 6px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--bg); box-shadow: 0 -1px 0 var(--card); }
  .bar button { flex: 1; padding: 14px 0; font-weight: 600; }
  .sendb { flex: 2 !important; background: var(--btn); color: var(--btn-fg); }
  .skipb { background: var(--card); color: var(--danger); }
  .later { background: var(--card); color: var(--fg); }
  .msg { margin-top: 12px; font-size: 14px; color: var(--muted); min-height: 1em; }
  .msg.err { color: var(--danger); }
  .done { text-align: center; padding: 40px 0; font-size: 18px; }
</style>
</head>
<body>
<div id="app"><div class="msg">Loading…</div></div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
let id = new URLSearchParams(location.search).get('id');
const base = location.pathname.replace(/\/panel$/, '');
const app = document.getElementById('app');
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let queue = [];          // ids still waiting, in order
const later = new Set(); // passed over this session without acting

async function api(path, body) {
  const r = await fetch(base + path, {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg ? tg.initData : '' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('Error ' + r.status));
  return data;
}
const call = (path, body) => api('/' + encodeURIComponent(id) + path, body);
const fail = e => { app.innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; };

// After Send, Skip or Later: straight to the next card, no closing and reopening.
async function next(flash) {
  if (flash && tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  try { queue = (await api('/pending')).ids; } catch (e) { return fail(e); }
  const left = queue.filter(x => !later.has(x));
  if (!left.length) {
    app.innerHTML = '<div class="done">' + (flash ? esc(flash) + '<br><br>' : '') + 'All caught up.</div>';
    setTimeout(() => tg && tg.close(), 1200);
    return;
  }
  id = left[0];
  load(flash);
}

function load(flash) {
  call('').then(d => { render(d, flash); window.scrollTo(0, 0); }).catch(fail);
}

function render(d, flash) {
  if (d.status !== 'pending') return next();
  const pos = queue.indexOf(id) + 1;
  app.innerHTML = `
    <div class="top">${flash ? `<span class="flash">${esc(flash)}</span>` : ''}<span>${pos > 0 ? `${pos} of ${queue.length}` : ''}</span></div>
    <div class="who">${esc(d.full_name)}${d.kind === 'close_no' ? ' <span class="tag">a no</span>' : ''}</div>
    <div class="sub">${esc([d.company_name, 'to ' + d.account_name].filter(Boolean).join(' · '))}</div>
    ${d.headline ? `<div class="sub">${esc(d.headline)}</div>` : ''}
    <div class="links">
      ${d.profile_url ? `<a href="${esc(d.profile_url)}" target="_blank">LinkedIn profile</a>` : ''}
      <a href="https://app.heyreach.io/inbox" target="_blank">HeyReach inbox</a>
    </div>
    ${d.thread && d.thread.length
      ? `<div class="thread">${d.thread.map(m => `<div class="bubble ${m.from}">${esc(m.text)}<div class="when">${m.from === 'us' ? 'Us' : esc(d.full_name.split(' ')[0])}${m.at ? ' · ' + esc(new Date(m.at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })) : ''}</div></div>`).join('')}</div>`
      : `<div class="theirs">${esc(d.their_text)}</div>`}
    <label for="draft">Your reply (tap to change it)</label>
    <textarea id="draft">${esc(d.draft)}</textarea>
    <div class="row">
      <input id="note" placeholder="Or say what to change, e.g. make it Thursday">
      <button class="ghost" id="rewrite">Rewrite</button>
    </div>
    <div class="msg" id="msg">${d.enabled ? '' : 'Phone replies are switched off, so Send is blocked.'}</div>
    <div class="bar" id="bar">
      <button class="skipb" id="skip">Skip</button>
      <button class="later" id="later">Later</button>
      <button class="sendb" id="send">Send</button>
    </div>
    <div class="bar" id="laterbar" style="display:none">
      <button class="later" data-days="1">Tomorrow</button>
      <button class="later" data-days="7">1 week</button>
      <button class="later" data-days="30">1 month</button>
      <button class="skipb" id="cancel">✕</button>
    </div>`;
  const $ = s => document.getElementById(s);
  const msg = (t, err) => { $('msg').textContent = t || ''; $('msg').className = 'msg' + (err ? ' err' : ''); };
  const busy = on => ['send', 'skip', 'later', 'rewrite'].forEach(b => $(b).disabled = on);

  $('send').onclick = async () => {
    const text = $('draft').value.trim();
    if (!text) return msg('Nothing to send.', true);
    busy(true); msg('Sending…');
    try { await call('/send', { text }); next(`Sent to ${d.full_name.split(' ')[0]} ✓`); }
    catch (e) { msg(e.message, true); busy(false); }
  };
  $('rewrite').onclick = async () => {
    const note = $('note').value.trim();
    if (!note) return msg('Type what to change first.', true);
    busy(true); msg('Rewriting…');
    try { const r = await call('/edit', { note }); $('draft').value = r.draft; $('note').value = ''; msg(r.note || 'Rewritten. Check it, then Send.'); }
    catch (e) { msg(e.message, true); }
    busy(false);
  };
  $('skip').onclick = async () => {
    busy(true);
    try { await call('/skip', {}); next('Skipped'); }
    catch (e) { msg(e.message, true); busy(false); }
  };
  // Later: pick when it comes back as a fresh card.
  $('later').onclick = () => { $('bar').style.display = 'none'; $('laterbar').style.display = 'flex'; };
  $('cancel').onclick = () => { $('laterbar').style.display = 'none'; $('bar').style.display = 'flex'; };
  document.querySelectorAll('#laterbar [data-days]').forEach(b => b.onclick = async () => {
    const days = Number(b.dataset.days);
    document.querySelectorAll('#laterbar button').forEach(x => x.disabled = true);
    try {
      const r = await call('/snooze', { days });
      const when = new Date(r.until).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      next(`Back on ${when}`);
    } catch (e) { msg(e.message, true); document.querySelectorAll('#laterbar button').forEach(x => x.disabled = false); }
  });
}

document.addEventListener('click', e => { const a = e.target.closest('a[target=_blank]'); if (a && tg) { e.preventDefault(); tg.openLink(a.href); } });
// Opened from a card: start on that card. Opened from the menu: start at the top.
api('/pending').then(r => { queue = r.ids; if (id) load(); else next(); }).catch(fail);
</script>
</body>
</html>
